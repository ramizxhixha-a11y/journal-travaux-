name: Générer PDF Journal des Travaux

on:
  workflow_dispatch:
    inputs:
      projet_id:
        description: 'ID du projet (ex. PRJ-001)'
        required: true
        default: 'PRJ-001'
  push:
    paths:
      - 'data/**.json'
      - 'pdf/**'
      - 'cachet.*'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pdf/requirements.txt

      - name: Determine projet_id
        id: pid
        run: |
          if [ -n "${{ github.event.inputs.projet_id }}" ]; then
            echo "value=${{ github.event.inputs.projet_id }}" >> $GITHUB_OUTPUT
          else
            FIRST=$(ls data/*.json 2>/dev/null | head -n1)
            if [ -z "$FIRST" ]; then
              echo "Aucun JSON trouvé dans data/. Annulation."
              exit 1
            fi
            PID=$(basename "$FIRST" .json)
            echo "value=$PID" >> $GITHUB_OUTPUT
          fi

      - name: Build PDF
        run: |
          mkdir -p output
          python pdf/build_pdf.py "data/${{ steps.pid.outputs.value }}.json" \
                                  "output/Journal_Travaux_${{ steps.pid.outputs.value }}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal_Travaux_${{ steps.pid.outputs.value }}
          path: output/Journal_Travaux_${{ steps.pid.outputs.value }}.pdf
          retention-days: 90
