name: Generer PDF
on:
  workflow_dispatch:
    inputs:
      projet_id:
        description: 'PRJ-001'
        required: true
        default: 'PRJ-001'
  push:
    paths:
      - 'data/**.json'
      - 'pdf/**'
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r pdf/requirements.txt
      - name: Build PDF
        run: |
          mkdir -p output
          python pdf/build_pdf.py "data/${{ github.event.inputs.projet_id || 'PRJ-001' }}.json" "output/journal.pdf"
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Journal-Travaux-PDF
          path: output/journal.pdf
          retention-days: 90
